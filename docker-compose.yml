services:
  postgres:
    image: postgres:16-alpine
    container_name: reconciliation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reconciliation_db
      POSTGRES_USER: reconciliation_user
      POSTGRES_PASSWORD: reconciliation_pass
    ports:
      - "5432:5432"
    volumes:
      - reconciliation_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconciliation_user -d reconciliation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  reconciliation_pg_data:
