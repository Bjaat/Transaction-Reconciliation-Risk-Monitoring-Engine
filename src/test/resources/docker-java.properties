# Docker Engine 29+ rejects any client below API version 1.44 (see
# https://www.docker.com/blog/docker-engine-version-29/). The docker-java
# client bundled with the Testcontainers version Spring Boot 3.3.4 resolves
# does not negotiate the API version with the daemon automatically and falls
# back to an old default, which the daemon then rejects with a 400 Bad
# Request that looks like a Docker-not-running error but isn't.
#
# This has nothing to do with the project's code — it's purely a
# Testcontainers/Docker Engine version compatibility issue, hit by anyone
# running Docker Desktop 4.52+ (Engine 29+) with an older Testcontainers.
#
# Pinning the version here forces a value inside both the daemon's accepted
# range and docker-java's supported range.
api.version=1.44
