spring:
  application:
    name: txn-reconciliation-engine

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reconciliation_db}
    username: ${DB_USER:reconciliation_user}
    password: ${DB_PASSWORD:reconciliation_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    # 'validate': Hibernate checks the entity mappings against the schema at
    # startup and fails fast on a mismatch, but never issues DDL itself.
    # Flyway (below) is now the only thing allowed to change the schema, via
    # versioned, reviewable SQL migrations in src/main/resources/db/migration.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

risk:
  rules:
    large-amount-threshold: 10000

server:
  port: 8080

logging:
  level:
    com.reconciliation.engine: INFO
